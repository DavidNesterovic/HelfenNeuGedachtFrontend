name: Docker Build & Push

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lgiselbrecht/helfenneugedacht.frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build & Push
        env:
          # Repo-Secret GHCR_PAT (Classic PAT von lgiselbrecht mit write:packages)
          TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          VERSION="0.0.${{ github.run_number }}"

          echo "$TOKEN" | docker login ghcr.io -u lgiselbrecht --password-stdin
          docker build --pull -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

          echo "Gepusht: $IMAGE:$VERSION" >> "$GITHUB_STEP_SUMMARY"
