name: Build & Release

# Push auf master  -> Quality Gate, Image als "latest" + "edge" + "sha-<commit>" (wird deployt)
# Tag vX.Y.Z       -> Quality Gate, Image als "X.Y.Z", "X.Y", "latest" + GitHub Release mit Release Notes
# Tag vX.Y.Z-rc.1  -> wie oben, aber nur "X.Y.Z-rc.1" und als Pre-Release markiert
# Ablauf und Regeln: docs/release.md

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lgiselbrecht/helfenneugedacht.frontend
  # Komodo-Procedure für den Deploy (zieht das gerade gepushte Image)
  KOMODO_WEBHOOK_URL: https://komodo.dergerber.net/listener/github/procedure/69c2d355a7c17c7d520ba34a/__ANY__

# Läufe für denselben Branch/Tag nacheinander, damit "edge" nie von einem älteren Lauf überschrieben wird
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      release: ${{ steps.meta.outputs.release }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # für die master-Prüfung des Tags

      - id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error title=Release::Tag '$TAG' ist keine gültige Version (erwartet vX.Y.Z oder vX.Y.Z-rc.N)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
              echo "::error title=Release::Tag '$TAG' zeigt auf einen Commit, der nicht auf master liegt"
              exit 1
            fi
            VERSION="${TAG#v}"
            if [ -n "${BASH_REMATCH[4]}" ]; then
              PRERELEASE=true
              TAGS="$VERSION"
            else
              PRERELEASE=false
              TAGS="$VERSION ${BASH_REMATCH[1]}.${BASH_REMATCH[2]} latest"
            fi
            RELEASE=true
          else
            if [ "$GITHUB_REF_NAME" != "master" ]; then
              echo "::error title=Build::Images werden nur von master oder von Release-Tags gebaut"
              exit 1
            fi
            VERSION="edge-$SHORT_SHA"
            # latest = neuester Stand von master, den Komodo deployt
            TAGS="latest edge sha-$SHORT_SHA"
            RELEASE=false
            PRERELEASE=false
          fi
          {
            echo "version=$VERSION"
            echo "tags=$TAGS"
            echo "release=$RELEASE"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Version: \`$VERSION\` · Image-Tags: \`$TAGS\`" >> "$GITHUB_STEP_SUMMARY"

  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  build-and-push:
    name: Docker Build, Scan & Push
    needs: [version, quality-gate]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAGS: ${{ needs.version.outputs.tags }}
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          TAG_ARGS=()
          for t in $TAGS; do TAG_ARGS+=(-t "$IMAGE:$t"); done
          docker build --pull "${TAG_ARGS[@]}" \
            --label "org.opencontainers.image.title=HelfenNeuGedacht Frontend" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .
          echo "SCAN_REF=$IMAGE:${TAGS%% *}" >> "$GITHUB_ENV"

      # Image-Scan (Base-Image + OS-Pakete). Nur behebbare Lücken blockieren,
      # sonst wäre die Pipeline wegen Upstream-CVEs ohne Fix dauerhaft rot.
      - name: Trivy – alle Findings (nur Warnung)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --severity LOW,MEDIUM,HIGH,CRITICAL --exit-code 0 "$SCAN_REF"

      - name: Trivy – HIGH/CRITICAL mit Fix (blockierend)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.65.0 \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$SCAN_REF"

      - name: Push
        env:
          # Repo-Secret GHCR_PAT (Classic PAT von lgiselbrecht mit write:packages)
          TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u lgiselbrecht --password-stdin
          for t in $TAGS; do
            docker push "$IMAGE:$t"
            echo "Gepusht: \`$IMAGE:$t\`" >> "$GITHUB_STEP_SUMMARY"
          done

  release:
    name: GitHub Release
    needs: [version, build-and-push]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release anlegen
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # git-cliff braucht alle Commits und Tags
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Annotierter Tag: erste Zeile der Tag-Nachricht = Titel-Zusatz, Rest = Einleitung der Release Notes
      # (git tag -a v0.1.0 -m "Initial Release" -m "Beschreibung ..."). Lightweight-Tags -> nur Version als Titel.
      - name: Release Notes erzeugen (Tag-Nachricht + git-cliff, siehe cliff.toml)
        run: |
          TAG="$GITHUB_REF_NAME"
          # actions/checkout macht annotierte Tags zu Lightweight-Tags -> Tag-Objekt explizit holen
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          TITLE="$TAG"
          INTRO=""
          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            SUBJECT="$(git tag -l --format='%(contents:subject)' "$TAG")"
            INTRO="$(git tag -l --format='%(contents:body)' "$TAG")"
            if [ -n "$SUBJECT" ] && [ "$SUBJECT" != "$TAG" ]; then TITLE="$TAG – $SUBJECT"; fi
          fi
          echo "RELEASE_TITLE=$TITLE" >> "$GITHUB_ENV"

          CHANGES="$(npx --yes git-cliff@2.14.2 --current --strip all)"
          COUNT="$(grep -c '^- ' <<< "$CHANGES" || true)"
          {
            if [ -n "$INTRO" ]; then echo "$INTRO"; echo; fi
            echo "## Docker image"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "## Changes"
            echo
            # Erstes Release (kein vorheriger Tag): komplette Historie einklappen, damit die Einleitung oben bleibt
            if git describe --tags --abbrev=0 "$TAG^" > /dev/null 2>&1; then
              echo "$CHANGES"
            else
              echo "<details><summary>All $COUNT commits up to this release</summary>"
              echo
              echo "$CHANGES"
              echo
              echo "</details>"
            fi
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=()
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$RELEASE_TITLE" --notes-file release-notes.md "${FLAGS[@]}"

  deploy:
    name: Deploy (Komodo)
    # Erst nach dem Push nach GHCR, weil Komodo das neue Image zieht
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Komodo-Webhook auslösen
        shell: bash
        env:
          WEBHOOK_SECRET: ${{ secrets.KOMODO_WEBHOOK_SECRET }}
        run: |
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo "::error title=Deploy::Repo-Secret KOMODO_WEBHOOK_SECRET fehlt (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # Komodo prüft wie GitHub die HMAC-SHA256-Signatur des Bodys mit dem Webhook-Secret
          BODY=$(printf '{"ref":"%s","after":"%s","repository":{"full_name":"%s"}}' "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_REPOSITORY")
          SIGNATURE=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$KOMODO_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-Hub-Signature-256: sha256=$SIGNATURE" \
            --data "$BODY"
          echo "## 🚀 Deploy über Komodo ausgelöst" >> "$GITHUB_STEP_SUMMARY"
