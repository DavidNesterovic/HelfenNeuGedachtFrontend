name: Quality Gate

# Läuft bei jedem Pull Request und wird zusätzlich von docker-publish.yml
# vor dem Build & Push aufgerufen. Schlägt ein Job fehl, wird nichts deployed.
#
# BLOCKIEREND (Exit-Code != 0):
#   - ESLint-Errors, TypeScript-Fehler
#   - Fehlschlagende Unit-Tests (Vitest)
#   - Semgrep-Findings mit Severity ERROR
#   - npm audit: HIGH/CRITICAL in Produktions-Dependencies (außer gültige
#     Ausnahmen in audit-exceptions.json)
#   - Secrets im Git-Verlauf (gitleaks)
#   - Starkes Copyleft (GPL/AGPL/SSPL/...) in Produktions-Dependencies
# NUR WARNUNG (Annotation, Pipeline läuft weiter):
#   - ESLint-Warnings, Semgrep WARNING/INFO
#   - Test-Coverage (wird nur berichtet, kein Mindestwert)
#   - npm audit: LOW/MODERATE bzw. Findings in devDependencies
#   - Schwaches Copyleft (MPL/LGPL/EPL) oder unbekannte Lizenzen

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: ESLint (Errors blockieren, Warnings nicht)
        run: npx eslint . --format stylish

      - name: TypeScript Typecheck
        run: npx nuxt typecheck

  tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Vitest (fehlschlagende Tests blockieren)
        run: npx vitest run --coverage

      - name: Coverage-Zusammenfassung (nur Info)
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: |
          node -e "
            const t = require('./coverage/coverage-summary.json').total;
            const rows = ['statements', 'branches', 'functions', 'lines']
              .map(k => '| ' + k + ' | ' + t[k].pct + ' % | ' + t[k].covered + '/' + t[k].total + ' |');
            console.log(['### Test-Coverage', '', '| Metrik | Abdeckung | Abgedeckt |', '|---|---|---|', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage-Report hochladen
        if: always() && hashFiles('coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  sast:
    name: Security – SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5

      - name: Semgrep – alle Findings (nur Warnung)
        run: semgrep scan --config p/javascript --config p/typescript --config p/owasp-top-ten --metrics=off

      - name: Semgrep – ERROR-Findings (blockierend)
        run: semgrep scan --config p/javascript --config p/typescript --config p/owasp-top-ten --metrics=off --severity ERROR --error

  dependencies:
    name: Security – Dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Alle Schwachstellen inkl. devDependencies (nur Warnung)
        run: |
          npm audit --package-lock-only --audit-level=low \
            || echo "::warning title=npm audit::Schwachstellen gefunden (Details im Log) – nicht blockierend"

      # Ausnahmen (mit Begründung + Ablaufdatum) stehen in audit-exceptions.json
      - name: HIGH/CRITICAL in Produktions-Dependencies (blockierend, außer Ausnahmen)
        run: npm run audit:check

  secrets:
    name: Security – Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # kompletter Verlauf, auch gelöschte Secrets zählen
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose --exit-code 1

  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run license:check
