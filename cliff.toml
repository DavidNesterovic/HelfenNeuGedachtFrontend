# Release notes for GitHub Releases, generated by git-cliff (https://git-cliff.org).
# Preview locally: npm run release:notes
# Conventional commits (feat:, fix:, ...) are grouped by type; everything else lands under "Other".

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/DavidNesterovic/HelfenNeuGedachtFrontend/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "newest"
commit_parsers = [
  # Literal strings ('...'), damit die Regex-Backslashes nicht als TOML-Escapes gelten
  { message = '^Merge ', skip = true },
  { message = '^feat(\(.*\))?!?:', group = "<!-- 0 -->Features" },
  { message = '^fix(\(.*\))?!?:', group = "<!-- 1 -->Bug Fixes" },
  { message = '^perf(\(.*\))?!?:', group = "<!-- 2 -->Performance" },
  { message = '^refactor(\(.*\))?!?:', group = "<!-- 3 -->Refactoring" },
  { message = '^test(\(.*\))?!?:', group = "<!-- 4 -->Tests" },
  { message = '^docs(\(.*\))?!?:', group = "<!-- 5 -->Documentation" },
  { message = '^(ci|build)(\(.*\))?!?:', group = "<!-- 6 -->CI/CD" },
  { message = '^(chore|style)(\(.*\))?!?:', group = "<!-- 7 -->Maintenance" },
  { message = '.*', group = "<!-- 8 -->Other" },
]
